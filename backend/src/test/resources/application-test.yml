spring:
  datasource:
    url: jdbc:h2:mem:querypilot_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-only-jwt-secret-for-querypilot-automated-tests
  expiration: 900000
  issuer: QueryPilot

logging:
  level:
    com.querypilot: INFO
