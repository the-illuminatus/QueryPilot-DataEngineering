<h2 mat-dialog-title>{{ savedQuery.title }}</h2>

<mat-dialog-content class="qp-saved-query-detail">
  <div class="qp-saved-query-detail__row">
    <span class="qp-saved-query-detail__label">Created At</span>
    <span class="qp-saved-query-detail__value">{{ savedQuery.createdAt | date: 'medium' }}</span>
  </div>

  <div class="qp-saved-query-detail__row">
    <span class="qp-saved-query-detail__label">Updated At</span>
    <span class="qp-saved-query-detail__value">{{ savedQuery.updatedAt | date: 'medium' }}</span>
  </div>

  <div class="qp-saved-query-detail__block">
    <span class="qp-saved-query-detail__label">Question</span>
    <p class="qp-saved-query-detail__question">{{ savedQuery.question }}</p>
  </div>

  <div class="qp-saved-query-detail__block">
    <span class="qp-saved-query-detail__label">Generated SQL</span>
    <pre class="qp-saved-query-detail__sql">{{ savedQuery.generatedSql }}</pre>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" mat-dialog-close>Close</button>
</mat-dialog-actions>
