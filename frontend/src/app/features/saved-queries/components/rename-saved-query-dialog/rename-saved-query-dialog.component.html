<h2 mat-dialog-title>Rename Saved Query</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="qp-rename-dialog__field">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" autocomplete="off" maxlength="100" required />
      @if (form.controls.title.hasError('required')) {
        <mat-error>A title is required.</mat-error>
      } @else if (form.controls.title.hasError('maxlength')) {
        <mat-error>Title must not exceed 100 characters.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Save</button>
  </mat-dialog-actions>
</form>
