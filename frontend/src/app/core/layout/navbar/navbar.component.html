<mat-toolbar class="qp-navbar" color="primary">
  <button mat-icon-button class="qp-navbar__menu-btn" aria-label="Toggle navigation" (click)="menuToggle.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="qp-navbar__brand">
    <mat-icon aria-hidden="true">bolt</mat-icon>
    QueryPilot
  </span>

  <span class="qp-navbar__spacer"></span>

  <button mat-icon-button aria-label="Notifications">
    <mat-icon>notifications_none</mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Account menu">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    @if (currentUser(); as user) {
      <div class="qp-navbar__user-email">{{ user.email }}</div>
      <mat-divider></mat-divider>
    }
    <button mat-menu-item (click)="goToProfile()">
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
