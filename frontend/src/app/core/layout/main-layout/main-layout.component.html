<div class="qp-shell">
  <qp-navbar (menuToggle)="drawer.toggle()"></qp-navbar>

  <mat-sidenav-container class="qp-shell__container" [hasBackdrop]="(isHandset$ | async) ?? false">
    <mat-sidenav
      #drawer
      class="qp-shell__sidenav"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false"
    >
      <qp-sidebar></qp-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="qp-shell__content">
      <main class="qp-shell__main">
        <router-outlet></router-outlet>
      </main>
      <qp-footer></qp-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
