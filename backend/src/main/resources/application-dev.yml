spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/querypilot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-override-with-JWT_SECRET-env-var}

gemini:
  api-key: ${GEMINI_API_KEY:dev-only-placeholder-override-with-GEMINI_API_KEY-env-var}

logging:
  level:
    com.querypilot: DEBUG
