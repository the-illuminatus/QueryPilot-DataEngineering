<mat-nav-list class="qp-sidebar">
  @for (item of navItems; track item.route) {
    <a mat-list-item [routerLink]="item.route" routerLinkActive="qp-sidebar__link--active">
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
    </a>
  }
</mat-nav-list>
